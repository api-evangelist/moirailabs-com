      meet the verified bar.
  - write: registerContract (POST /contracts)
    reversal: deleteContract (DELETE /contracts/{contractAddress})
    window: not stated
    grade: documented
    note: Delete "will delete contract from list of analysis"; whether indexed data or consumed plan slots are restored
