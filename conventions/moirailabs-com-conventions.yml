  retention: undocumented (the spec declares a 410 "The reused invocation result has expired" and a 409 "Idempotency-Key
    was reused for another request or the invocation is no longer reusable", so keys expire, but no window is stated)
  conflict_behavior: 409 when the key is reused with a different request or the invocation is no longer reusable;
    410 when the reused result has expired; 400 on an invalid key
  key_format: string; format and length undocumented
  evidence: CORS Access-Control-Allow-Headers on api.moirailabs.com lists Idempotency-Key, Prefer and X-Request-ID;
