async_operations:
  pattern: durable job with Prefer negotiation (RFC 7240 style)
  create: POST /analytics/invocations (operation enum COHORT_TRANSACTIONS | COHORTS | DASHBOARD | PRODUCT_DASHBOARD
    | METRICS | METHODS | TOKENS, discriminated oneOf request)
  prefer:
    wait=N: server waits up to N seconds for the same job; 200 when it completes inside the budget
    respond-async: returns 202 immediately
  on_202:
    headers:
    - Location (invocation status URL)
    - Retry-After (polling delay in seconds)
    - X-Request-ID
    body: AnalyticsInvocationStatusResponse with status (QUEUED | WAITING_DEPENDENCY | RUNNING | SUCCEEDED | FAILED
      | CANCEL_REQUESTED | CANCELLED | EXPIRED), stage, attempt/maxAttempts, retryAfterSeconds, dependencyId, links
      {self, result, cancel}
  poll: GET /analytics/invocations/{id} (status) then GET /analytics/invocations/{id}/result — 202 not ready, 200
    stored result (calculation is not rerun), 409 cancelled, 410 expired, 422 failed permanently
  cancel: POST /analytics/invocations/{id}/cancel — 202 accepted, 409 already complete
  note: 'The best-designed corner of the contract: explicit state machine, HATEOAS links, Retry-After and Location.
    It is also REST-only — the A2A skills expose the synchronous GET endpoints.'
reversibility:
  grade: documented
  summary: One write surface has a reversal path with no stated window; the rest have none. Reads dominate (23 of
    36 operations).
  surfaces:
  - write: create (POST /analytics/invocations)
    reversal: cancel (POST /analytics/invocations/{id}/cancel)
    window: until the invocation completes — 409 "Invocation is already complete and cannot be cancelled"; no time
