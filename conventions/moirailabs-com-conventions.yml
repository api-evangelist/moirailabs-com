  - write: simpleProfile / enrichedProfile (POST /wallet-profiling/*)
    reversal: null
    window: not stated
    grade: none
    note: Credit-metered (WalletProfilingBillingResponse); no reversal of consumed quota is documented.
  - write: createUser / updateUser
    reversal: null
    window: not stated
    grade: none
    note: Account deletion is offered only by emailing hello@moirailabs.com (privacy policy section 5), not via
      the API.
  - write: createPlan / updatePlan / deletePlan
    reversal: deletePlan
    window: not stated
    grade: documented
    note: Admin-only per the descriptions; deletePlan reverses createPlan.
