aid: moirailabs-com
name: Moirai Labs
description: 'Moirai Labs is a smart-contract analytics platform for Web3 teams that turns raw EVM chain data (Ethereum,
  Polygon, Arbitrum, Optimism, Base, Linea) into product-grade metrics: cohort retention, method-level call breakdowns,
  daily reports, product dashboards and wallet profiling. The same credit-metered core is exposed three ways — a
  bearer-JWT REST API described by an OpenAPI 3.0.1 document with 36 operations (including durable, idempotent asynchronous
  analytics invocations), an A2A 1.0 agent ("Moirai Agents API", 11 skills, registered in the A2A Registry) and
  an MCP bridge on the agent host — alongside an OpenAI ai-plugin.json manifest, llms.txt and an RFC 9116 security.txt.
  Subscription plans meter contracts under analysis per 30-day period; the plan catalog is served anonymously by
  the API.'
url: https://raw.githubusercontent.com/api-evangelist/moirailabs-com/refs/heads/main/apis.yml
