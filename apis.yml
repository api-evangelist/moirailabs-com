- aid: moirailabs-com:moirai-labs-api
  name: Moirai Labs API
  description: 'REST API for smart-contract analytics on EVM chains: register contracts and track indexer sync,
    run cohort / method / metrics / dashboard / token analytics synchronously or as durable asynchronous invocations
    (Idempotency-Key, Prefer: wait=N | respond-async, 202 + Location + Retry-After, cancel), fetch daily reports,
    profile wallets, and read plans and subscriptions. Bearer JWT; 36 operations; OpenAPI 3.0.1 published at https://moirailabs.com/openapi.json.'
