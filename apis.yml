- aid: moirailabs-com:moirai-agents-api
  name: Moirai Agents API (A2A + MCP)
  description: A2A 1.0 agent ("A2A-compatible analytics and contract intelligence agent", version 0.1.0) with 11
    skills — analytics.cohorts/metrics/methods/methods_by_cohorts/transactions, reports.daily/weekly/monthly, contracts.register/status
    and mcp.bridge — served over JSON-RPC at agent.moirailabs.com/a2a/rpc and HTTP+JSON at /a2a, plus an MCP bridge
    at /a2a/v1/mcp. Bearer-gated (401 without a token); the agent card is published at moirailabs.com/.well-known/agent-card.json
    and declares an A2P credit-settlement extension.
