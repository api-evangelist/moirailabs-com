summary: 'Moirai Labs ships one remote MCP surface: an "MCP bridge" mounted on the A2A agent host at https://agent.moirailabs.com/a2a/v1/mcp,
  declared by the agent card as a vendor extension and by the /a2a page ("An MCP-compatible client (Claude Desktop,
  Cursor, custom IDE) exposes MoiraiLabs as a tool ... with credit-aware rate limits ... Streaming responses (server-sent
  events)"). It is bearer-gated: POST tools/list without a token returns HTTP 401 {"code":"unauthorized","message":"Missing
  bearer token"}, so the live tool list and inputSchemas could not be read anonymously. The provider publishes no
  MCP tool list anywhere else (llms.txt names no tools), so tools[] below is the A2A skill list the card publishes,
  which the bridge most plausibly projects — marked as such, not as an observed tools/list.'
deployment:
  mode: remote
  endpoint: https://agent.moirailabs.com/a2a/v1/mcp
  install: null
  package: null
  auth: api-key
  verified: probed
  note: 'The card writes the endpoint as http://; the host 301s http->https, and the https form was probed. No stdio
    package exists: npm, PyPI and the moirailabs GitHub org (0 public repos) were searched. auth is api-key in the
    sense the rubric uses — a per-agent bearer token issued through the Moirai Labs dashboard, not an OAuth flow:
    agent.moirailabs.com serves no oauth-protected-resource or oauth-authorization-server metadata (both 401), and
    the 401 carries no WWW-Authenticate resource_metadata hint.'
