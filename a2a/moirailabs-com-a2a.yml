    names https://agent.moirailabs.com/.well-known/agent-card.json as the ''live'' card; that live URL did not answer
    on 2026-09-19 — three GETs (https, https -k, http->301->https) each timed out after 30s with 0 bytes, while
    every OTHER path on agent.moirailabs.com (/docs, /a2a, /a2a/rpc, /a2a/v1/mcp, /.well-known/agent.json) answered
    instantly with HTTP 401 {"code":"unauthorized","message":"Missing bearer token"}. The apex mirror is therefore
    the only agent card Moirai Labs currently serves anonymously. Ownership is not in question: provider.organization
    is ''Moirai Labs'', provider.url is https://moirailabs.com, the interfaces sit on agent.moirailabs.com (same
