summary: The only numbers Moirai Labs publishes are per-plan monthly quotas for "AI Chat with Agent" requests (5/10/50/200/300
  per month by tier) and per-plan contract slots. No requests-per-second/minute ceiling is published for the REST
  API, the A2A agent or the MCP bridge; the contract declares a 429 with Retry-After on one operation, the wallet-profiling
  responses carry an in-body {limit, remaining, resetAt} block, and the marketing copy says "credit-aware rate limits".
  An agent discovers the runtime ceiling only by hitting it.
